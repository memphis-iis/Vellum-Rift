<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vellum Rift — Enter Experience</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700&family=Hanken+Grotesk:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body class="vellum-shell">
  <div id="unity-viewport">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div class="vellum-loader-title">VELLUM RIFT</div>
      <div id="unity-progress-track">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>

  <div class="vellum-chrome" id="vellum-chrome" hidden>
    <header class="vellum-header">
      <div class="vellum-brand">
        <span class="vellum-wordmark">VELLUM RIFT</span>
        <span class="vellum-divider" aria-hidden="true"></span>
        <div class="vellum-session" id="vellum-session-label">Session</div>
      </div>
    </header>
    <div class="vellum-fog" aria-hidden="true"></div>

    <button type="button" class="vellum-shell-tab vellum-shell-tab--nav" id="vellum-nav-tab" hidden aria-label="Open menu">
      ☰
    </button>

    <aside class="vellum-nav glass-panel" id="vellum-nav" aria-label="Space menu">
      <div class="vellum-nav-head">
        <span aria-hidden="true">◎</span>
        <h3>Menu</h3>
        <button type="button" class="vellum-shell-panel__collapse" id="vellum-nav-collapse" aria-label="Collapse menu">‹</button>
      </div>
      <nav class="vellum-nav-links">
        <a class="vellum-nav-link" id="vellum-dashboard-link" href="https://iis.memphis.edu/static/vellum-dashboard/" target="_blank" rel="noopener">
          Dashboard
        </a>
      </nav>
      <section class="vellum-pins" aria-label="Session pins">
        <h4 class="vellum-pins-title">Pins</h4>
        <div id="vellum-pins-list" class="vellum-pins-list">
          <p class="vellum-pins-empty">Joining space…</p>
        </div>
      </section>
      <p class="vellum-nav-meta" id="vellum-nav-session">Session</p>
    </aside>

    <button type="button" class="vellum-shell-tab vellum-shell-tab--chat" id="vellum-chat-tab" hidden aria-label="Open space chat">
      💬
    </button>

    <aside class="vellum-chat glass-panel" id="vellum-chat" aria-label="Space chat">
      <div class="vellum-chat-head">
        <span class="vellum-chat-icon" aria-hidden="true">💬</span>
        <h3>Space chat</h3>
        <button type="button" class="vellum-shell-panel__collapse" id="vellum-chat-collapse" aria-label="Collapse chat">›</button>
      </div>
      <div class="vellum-chat-log" id="vellum-chat-log">
        <p class="vellum-chat-empty">Joining space…</p>
      </div>
      <form class="vellum-chat-compose" id="vellum-chat-form">
        <input
          type="text"
          id="vellum-chat-input"
          placeholder="Type a message…"
          maxlength="500"
          disabled
          aria-label="Chat message"
        />
        <button type="submit" id="vellum-chat-send" disabled aria-label="Send">➤</button>
      </form>
    </aside>

    <div class="vellum-controls" aria-label="Controls">
      <span><span class="vellum-kbd">W</span><span class="vellum-kbd">A</span><span class="vellum-kbd">S</span><span class="vellum-kbd">D</span> Move</span>
      <span class="vellum-controls-sep" aria-hidden="true"></span>
      <span>Mouse Look</span>
      <span class="vellum-controls-sep" aria-hidden="true"></span>
      <span><span class="vellum-kbd">LMB</span> Laser</span>
      <span class="vellum-controls-sep" aria-hidden="true"></span>
      <span><span class="vellum-kbd">F</span> Pin</span>
      <span class="vellum-controls-sep" aria-hidden="true"></span>
      <span><span class="vellum-kbd">L</span> Light</span>
      <span class="vellum-controls-sep" aria-hidden="true"></span>
      <span><span class="vellum-kbd">[</span><span class="vellum-kbd">]</span> Manuscript</span>
      <span class="vellum-controls-sep" aria-hidden="true"></span>
      <span><span class="vellum-kbd">Esc</span> Leave</span>
    </div>
  </div>

  <div class="vellum-pin-modal" id="vellum-pin-modal" hidden>
    <form class="vellum-pin-modal__card" id="vellum-pin-form">
      <h3 id="vellum-pin-title">Name this pin</h3>
      <input
        type="text"
        id="vellum-pin-input"
        maxlength="256"
        placeholder="Pin name"
        aria-label="Pin name"
        autocomplete="off"
      />
      <div class="vellum-pin-modal__actions">
        <button type="button" class="vellum-pin-modal__btn vellum-pin-modal__btn--ghost" id="vellum-pin-cancel">Cancel</button>
        <button type="submit" class="vellum-pin-modal__btn" id="vellum-pin-confirm">Save</button>
      </div>
    </form>
  </div>

  <div id="unity-warning"></div>

  <script src="TemplateData/shell-chrome.js"></script>
  <script src="TemplateData/shell-chat.js"></script>
  <script src="TemplateData/shell-pins.js"></script>
  <script>
    // Early auth-handoff queue (#247): accept dashboard tokens before Unity
    // finishes loading, then flush once unityInstance + GameObject exist.
    (function () {
      window._vellumPendingAuth = window._vellumPendingAuth || null;
      window._vellumAuthDelivered = !!window._vellumAuthDelivered;

      function trustedOrigin(origin) {
        if (!origin) return false;
        if (origin === window.location.origin) return true;
        try {
          var o = new URL(origin);
          var here = new URL(window.location.href);
          if (o.hostname === here.hostname) return true;
          if (o.hostname.endsWith(".memphis.edu") && here.hostname.endsWith(".memphis.edu"))
            return true;
        } catch (e) { /* ignore */ }
        var allow = window.VELLUM_AUTH_HANDOFF_ORIGINS || "";
        if (typeof allow === "string" && allow.length) {
          return allow.split(",").some(function (p) { return p.trim() === origin; });
        }
        return false;
      }

      function ack() {
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: "vellum-rift-auth-handoff-ack" }, "*");
          }
        } catch (e) { /* ignore */ }
      }

      function tryDeliver() {
        if (window._vellumAuthDelivered || !window._vellumPendingAuth) return false;
        var target = window._vellumAuthGameObject;
        if (!target) return false;
        var json = JSON.stringify(window._vellumPendingAuth);
        var sent = false;
        try {
          if (window.unityInstance && window.unityInstance.SendMessage) {
            window.unityInstance.SendMessage(target, "OnBluekeyTokenReceived", json);
            sent = true;
          }
        } catch (e) { /* ignore */ }
        if (!sent) return false;
        window._vellumAuthDelivered = true;
        window._vellumPendingAuth = null;
        ack();
        console.log("[VellumRift] Early-queued auth token delivered to Unity");
        return true;
      }

      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || typeof data !== "object") return;
        if (data.type !== "vellum-rift-auth-handoff") return;
        if (window._vellumAuthDelivered) return;
        if (!trustedOrigin(event.origin)) {
          console.warn("[VellumRift] Ignoring early auth handoff from " + event.origin);
          return;
        }
        if (!data.accessToken) return;
        window._vellumPendingAuth = {
          accessToken: data.accessToken,
          email: data.email || "",
        };
        if (!tryDeliver()) {
          console.log("[VellumRift] Auth handoff queued (Unity not ready yet)");
        }
      });

      // Ask the opener to (re)send as soon as this page can listen.
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: "vellum-rift-webgl-ready" }, "*");
        }
      } catch (e) { /* ignore */ }

      // Same-tab / opener-less fallback: token already in sessionStorage (#254).
      (function trySessionStorageAuth() {
        if (window._vellumAuthDelivered || window._vellumPendingAuth) return;
        try {
          var token = sessionStorage.getItem("vellum_rift_access_token");
          if (!token || token === "local-dev") return;
          window._vellumPendingAuth = {
            accessToken: token,
            email: sessionStorage.getItem("vellum_rift_user_email") || "",
          };
          console.log("[VellumRift] Auth queued from sessionStorage (same-tab / no opener)");
        } catch (e) { /* ignore */ }
      })();

      // Cross-window same-origin handoff when opener is missing (#254).
      try {
        var bc = new BroadcastChannel("vellum-rift-auth");
        bc.onmessage = function (ev) {
          var data = ev && ev.data;
          if (!data || typeof data !== "object") return;
          if (data.type !== "vellum-rift-auth-handoff") return;
          if (window._vellumAuthDelivered) return;
          if (!data.accessToken) return;
          window._vellumPendingAuth = {
            accessToken: data.accessToken,
            email: data.email || "",
          };
          tryDeliver();
        };
      } catch (e) { /* BroadcastChannel unavailable */ }

      var flushTimer = window.setInterval(function () {
        if (tryDeliver() || window._vellumAuthDelivered) {
          window.clearInterval(flushTimer);
        }
      }, 300);
      window.setTimeout(function () { window.clearInterval(flushTimer); }, 90000);
    })();
  </script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var embed = params.get("embed") === "1";
      if (embed) {
        document.body.classList.add("vellum-embed");
      } else {
        var chrome = document.getElementById("vellum-chrome");
        if (chrome) chrome.hidden = false;
        var sessionId = params.get("session") || "";
        var player = params.get("playerName") || "";
        var label = document.getElementById("vellum-session-label");
        if (label) {
          label.textContent = player
            ? "Session: " + player
            : sessionId
              ? "Session: " + sessionId.slice(0, 8) + "…"
              : "Session";
        }
        var navMeta = document.getElementById("vellum-nav-session");
        if (navMeta) navMeta.textContent = label ? label.textContent : "Session";
      }

      var canvas = document.querySelector("#unity-canvas");
      var maxDpr = 2;

      function viewportRect() {
        return { width: window.innerWidth, height: window.innerHeight };
      }

      function layoutCanvas() {
        var rect = viewportRect();
        var cssW = Math.max(1, Math.floor(rect.width));
        var cssH = Math.max(1, Math.floor(rect.height));
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
      }

      window.addEventListener("resize", layoutCanvas);
      layoutCanvas();

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === "error") {
          div.style.background = "#93000a";
          div.style.color = "#ffdad6";
        } else if (type === "warning") {
          div.style.background = colorMixWarning();
          setTimeout(function () {
            if (div.parentNode) warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function colorMixWarning() {
        return "rgba(212, 180, 131, 0.25)";
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/web build.loader.js";
      var config = {
        dataUrl: buildUrl + "/web build.data.br",
        frameworkUrl: buildUrl + "/web build.framework.js.br",
        codeUrl: buildUrl + "/web build.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Memphis IIS",
        productName: "Vellum Rift",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, maxDpr),
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
        }).then(function (instance) {
          window.unityInstance = instance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          layoutCanvas();
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage({ type: "vellum-rift-webgl-ready" }, "*");
            }
          } catch (e) { /* ignore */ }
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
