services:
  app:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: Vellum-Rift-Dedicated-Server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vellum_rift
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET_NAME: local-manuscript-cache
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minioadmin
      RAW_ASSET_TTL_DAYS: 30
      STT_SERVICE_URL: http://localhost:10300
      REALTIME_JWT_SECRET: local-dev-realtime-secret
      SFU_PUBLIC_URL: http://localhost:4100
      JWT_ISSUER: vellum-rift-local
      JWT_AUDIENCE: vellum-rift-clients
      TTS_SERVICE_URL: http://localhost:10400
    ports:
      - "4000:4000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c
      "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/${S3_BUCKET_NAME}
      && mc anonymous set private local/${S3_BUCKET_NAME}"
    restart: "no"

volumes:
  postgres_data:
  minio_data:
