name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable corepack & install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck & lint all packages
        run: pnpm -r --if-present lint

      - name: Run backend unit tests
        run: pnpm --filter @vellum-rift/backend test

      - name: Build all packages
        run: pnpm build
