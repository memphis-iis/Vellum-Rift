name: Unity EditMode Tests

# Issue #210 / #271 — headless EditMode gate for the Unity client.
# Requires a Unity floating/personal license activated via GitHub Actions secrets.
# See docs/dev-onboarding/unity-setup.md § "EditMode / PlayMode tests & CI".

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vr-client-unity/**"
      - ".github/workflows/unity-editmode-tests.yml"
  push:
    branches: [main]
    paths:
      - "vr-client-unity/**"
      - ".github/workflows/unity-editmode-tests.yml"

jobs:
  editmode:
    name: EditMode
    runs-on: ubuntu-latest
    # Skip quietly when license secrets are not configured (forks / early setup).
    # workflow_dispatch always runs so maintainers can verify once secrets exist.
    if: ${{ github.event_name == 'workflow_dispatch' || secrets.UNITY_LICENSE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify license secret present
        if: ${{ secrets.UNITY_LICENSE == '' }}
        run: |
          echo "::error::UNITY_LICENSE secret is empty. Add UNITY_LICENSE (and optionally UNITY_EMAIL / UNITY_PASSWORD) per docs/dev-onboarding/unity-setup.md"
          exit 1

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: vr-client-unity/Vellum Rift
          unityVersion: 6000.2.13f1
          testMode: EditMode
          artifactsPath: unity-editmode-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode Tests
          customParameters: -nographics

      - name: Upload test results (NUnit / JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: |
            unity-editmode-results/**
            ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
