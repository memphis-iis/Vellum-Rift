# Museum-kit edge: same-origin dashboard + /api + /webgl on host :80
upstream kit_dashboard {
    server web-dashboard:80;
}
upstream kit_backend {
    server backend:4000;
}
upstream kit_webgl {
    server webgl:80;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://kit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webgl/ {
        proxy_pass http://kit_webgl/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://kit_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
