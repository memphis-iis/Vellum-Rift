# Museum-kit stack — extends lan-party ideas with edge :80 + UDP discovery.
# Does NOT replace infra/deploy/lan-party (fixed SERVER_LAN_IP path still supported).
#
# Boot via start-museum-kit.sh (detects DHCP IP → runtime.env → up).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vellum_rift}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vellum_rift}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kit_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c
      "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minioadmin}
      && mc mb --ignore-existing local/${S3_BUCKET_NAME:-vellumrift-lan}
      && mc anonymous set private local/${S3_BUCKET_NAME:-vellumrift-lan}"
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/memphis-iis/vellum-rift/backend:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
      - runtime.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vellum_rift}
      # runtime.env sets client-reachable S3; fall back to in-compose minio for first boot
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}

  web-dashboard:
    image: ${DASHBOARD_IMAGE:-museum-kit-web-dashboard:local}
    build:
      context: ../../..
      dockerfile: infra/deploy/lan-party/Dockerfile.dashboard
      args:
        # Same-origin via edge :80 (empty API base → window.location.origin)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WEBGL_BASE_URL: ${VITE_WEBGL_BASE_URL:-/webgl/}
        VITE_AUTH_REQUIRED: ${VITE_AUTH_REQUIRED:-false}
        VITE_CHAT_ENABLED: ${VITE_CHAT_ENABLED:-false}
        VITE_MUSEUM_KIOSK_SPACE_ID: ${VITE_MUSEUM_KIOSK_SPACE_ID:-}
    restart: unless-stopped
    # Not published — reach via edge :80

  webgl:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ${WEBGL_DIST:-../lan-party/webgl}:/usr/share/nginx/html:ro
      - ../lan-party/nginx-webgl.conf:/etc/nginx/conf.d/default.conf:ro

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web-dashboard
      - backend
      - webgl
    ports:
      - "${EDGE_PORT:-80}:80"
    volumes:
      - ./nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro

  lan-discover:
    build:
      context: ./lan-discover
    image: museum-kit-lan-discover:local
    network_mode: host
    restart: unless-stopped
    env_file:
      - runtime.env
    environment:
      SERVER_LAN_IP: ${SERVER_LAN_IP:-}
      PORT: ${PORT:-4000}
      DISCOVER_PORT: ${DISCOVER_PORT:-41234}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-}
      WEBGL_PUBLIC_URL: ${WEBGL_PUBLIC_URL:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}

volumes:
  kit_postgres_data:
  kit_minio_data:
