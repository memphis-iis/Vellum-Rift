# Unity WebGL static host (precompressed .br / .gz artifacts).
# Firefox: do not advertise Accept-Ranges on Content-Encoding: br — ranged
# fetches of brotli streams cause "Content Encoding Error" / brotli failures.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip off;

    # Uncompressed Unity artifacts (preferred for Firefox over plain HTTP).
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.js\.br$ {
        default_type application/javascript;
        add_header Content-Encoding br always;
        add_header Vary Accept-Encoding always;
        max_ranges 0;
        etag off;
        if_modified_since off;
    }

    location ~* \.wasm\.br$ {
        default_type application/wasm;
        add_header Content-Encoding br always;
        add_header Vary Accept-Encoding always;
        max_ranges 0;
        etag off;
        if_modified_since off;
    }

    location ~* \.data\.br$ {
        default_type application/octet-stream;
        add_header Content-Encoding br always;
        add_header Vary Accept-Encoding always;
        max_ranges 0;
        etag off;
        if_modified_since off;
    }

    location ~* \.js\.gz$ {
        default_type application/javascript;
        add_header Content-Encoding gzip always;
        add_header Vary Accept-Encoding always;
        max_ranges 0;
        etag off;
    }

    location ~* \.wasm\.gz$ {
        default_type application/wasm;
        add_header Content-Encoding gzip always;
        add_header Vary Accept-Encoding always;
        max_ranges 0;
        etag off;
    }

    location ~* \.data\.gz$ {
        default_type application/octet-stream;
        add_header Content-Encoding gzip always;
        add_header Vary Accept-Encoding always;
        max_ranges 0;
        etag off;
    }
}
