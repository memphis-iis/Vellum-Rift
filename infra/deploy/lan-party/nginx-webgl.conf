# Unity WebGL static host (precompressed .br / .gz artifacts).
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.js\.br$ {
        gzip off;
        add_header Content-Encoding br;
        default_type application/javascript;
    }

    location ~* \.wasm\.br$ {
        gzip off;
        add_header Content-Encoding br;
        default_type application/wasm;
    }

    location ~* \.data\.br$ {
        gzip off;
        add_header Content-Encoding br;
        default_type application/octet-stream;
    }

    location ~* \.js\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/javascript;
    }

    location ~* \.wasm\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/wasm;
    }

    location ~* \.data\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/octet-stream;
    }
}
