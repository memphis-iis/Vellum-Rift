# Offline LAN party stack — Postgres + Silo (S3/MinIO-compatible) + backend +
# dashboard (Vite/nginx) + WebGL static (nginx volume).
# Separate from infra/deploy/iis-memphis (do not run this on the Memphis host).
#
# Usage (from this directory, after copying .env.example → .env and placing a
# Unity WebGL museum build under ./webgl — see README):
#   docker compose up -d
#   ./start-with-dns.sh   # detect LAN IP → .env.runtime, then dnsmasq up
#
# Backend image: GHCR when set, otherwise build from repo root Dockerfile.
# Override: BACKEND_IMAGE=ghcr.io/memphis-iis/vellum-rift/backend:latest
# Dashboard: built from Dockerfile.dashboard with VITE_* from .env (or set
# DASHBOARD_IMAGE to a tag you built elsewhere with the same args).
#
# Alternative without containerized backend: use root `make infra-up` for
# Postgres/MinIO and `npm run dev` in backend/ with this profile’s env vars
# (point DATABASE_URL / S3_ENDPOINT at localhost ports).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vellum_rift}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vellum_rift}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - lan_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c
      "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minioadmin}
      && mc mb --ignore-existing local/${S3_BUCKET_NAME:-vellumrift-lan}
      && mc anonymous set private local/${S3_BUCKET_NAME:-vellumrift-lan}"
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/memphis-iis/vellum-rift/backend:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    env_file: .env
    environment:
      # In-compose DB hostname (overrides LAN IP DATABASE_URL from .env if needed).
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vellum_rift}
      S3_ENDPOINT: http://minio:9000
    # SFU is intentionally not started — LAN multiplayer uses HTTP polling.

  web-dashboard:
    image: ${DASHBOARD_IMAGE:-lan-party-web-dashboard:local}
    build:
      context: ../../..
      dockerfile: infra/deploy/lan-party/Dockerfile.dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WEBGL_BASE_URL: ${VITE_WEBGL_BASE_URL:?Set VITE_WEBGL_BASE_URL in .env (see .env.example)}
        VITE_AUTH_REQUIRED: ${VITE_AUTH_REQUIRED:-false}
        VITE_CHAT_ENABLED: ${VITE_CHAT_ENABLED:-false}
        VITE_MUSEUM_KIOSK_SPACE_ID: ${VITE_MUSEUM_KIOSK_SPACE_ID:-}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
      # Quest/captive-portal checks hit :80 on SERVER_LAN_IP when DNS sinkholes to the LAN host.
      - "${DASHBOARD_HTTP_PORT:-80}:80"

  # Fake DNS sinkhole — resolves all names to SERVER_LAN_IP so Quest Wi‑Fi stays up offline.
  # Bind to SERVER_LAN_IP:53 (not 0.0.0.0:53) to avoid fighting systemd-resolved on dev machines.
  # On the party router, forward DHCP DNS to SERVER_LAN_IP (see README → OpenWrt).
  # Fake DNS sinkhole (Quest captive portal). Image: dockurr/dnsmasq (not 46cl — private/missing).
  # Bind host ports to DNSMASQ_BIND_IP (default SERVER_LAN_IP). That address must exist on a
  # host iface or Docker fails with "cannot assign requested address". On OpenWrt LAN use the
  # kit IP; off-LAN tests can set DNSMASQ_BIND_IP to Tailscale/Wi‑Fi IP while SERVER_LAN_IP
  # stays the party address returned in answers.
  dnsmasq:
    image: dockurr/dnsmasq:latest
    restart: unless-stopped
    ports:
      - "${DNSMASQ_BIND_IP:-${SERVER_LAN_IP:?Set SERVER_LAN_IP in .env}}:53:53/udp"
      - "${DNSMASQ_BIND_IP:-${SERVER_LAN_IP:?Set SERVER_LAN_IP in .env}}:53:53/tcp"
    cap_add:
      - NET_ADMIN
    environment:
      SERVER_LAN_IP: ${SERVER_LAN_IP}
    volumes:
      - ./dnsmasq.conf.template:/template/dnsmasq.conf.template:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s/__SERVER_LAN_IP__/$${SERVER_LAN_IP}/" /template/dnsmasq.conf.template
        > /etc/dnsmasq.conf
        && exec /usr/bin/dnsmasq.sh

  webgl:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEBGL_PORT:-8080}:80"
    volumes:
      - ${WEBGL_DIST:-./webgl}:/usr/share/nginx/html:ro
      - ./nginx-webgl.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  lan_postgres_data:
  lan_minio_data:
