upstream lan_backend {
    server backend:4000;
}

upstream lan_webgl {
    server webgl:80;
}

server {
    listen 80;
    server_name _ localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Captive-portal / connectivity probes (Android, Windows, Quest via sinkholed DNS).
    location /generate_204 { return 204; }
    location /check_network_status { return 204; }
    location /connecttest.txt { return 200 "Microsoft Connect Test"; }

    location /api/ {
        proxy_pass http://lan_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin WebGL (Tailscale or LAN) — bake VITE_WEBGL_BASE_URL=/webgl/
    location /webgl/ {
        proxy_pass http://lan_webgl/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
